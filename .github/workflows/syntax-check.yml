name: CI/CD Pipeline to EC2

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  # Path filtering job to check which files changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - '.github/workflows/**'

  # Job 1: Frontend Syntax & Type Check
  frontend-check:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run frontend linter
        run: npm run lint --if-present

  # Job 2: Backend Syntax & Build Check
  backend-check:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: './backend/go.sum'

      - name: Run Go Vet (static analysis)
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Dry-run Go build
        run: go build -v -o /dev/null ./...

  # Job 3: Deploy to EC2
  deploy:
    needs: [changes, frontend-check, backend-check]
    # Run only if pushed to main/staging AND no checks failed (skipped checks count as successful)
    if: |
      always() &&
      github.event_name == 'push' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.LIVESTREAM_KEY }}
          script_stop: true # Ensures workflow fails immediately if a command returns an error
          script: |
            echo "Deploying to EC2..."
            cd /home/ubuntu/livestream

            # 1. Pull the latest code from GitHub
            git pull origin main
            
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 api consumer

            # 3. Clean up unused old Docker images to save EC2 disk space
            docker image prune -f
            