name: CI/CD Pipeline to EC2

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  # Path filtering job to check which files changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - '.github/workflows/**'

  # Job 1: Frontend Syntax & Type Check
  frontend-check:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run frontend linter
        run: npm run lint --if-present

  # Job 2: Backend Syntax & Build Check
  backend-check:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: './backend/go.sum'

      - name: Run Go Vet (static analysis)
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Dry-run Go build
        run: go build -v -o /dev/null ./...

  # Job 3: Build docker images on GitHub and push to GitHub Container Registry (GHCR)
  
  # ==============================================================================
  # GITHUB ACTIONS & DOCKER CONTEXT VARIABLES EXPLANATION
  # ==============================================================================
  # ${ { github.ref_name } }
  #   - What it is: The active Git branch or tag name triggering the run (e.g., 'staging', 'main').
  #   - Purpose: Dynamically sets the Docker image tag in GHCR and tells EC2 which branch to pull.
  #
  # ${ { github.actor } }
  #   - What it is: The GitHub username of the account that pushed the commit or triggered the workflow.
  #   - Purpose: Used as the username when logging into GitHub Container Registry (ghcr.io).
  #
  # ${ { github.repository_owner } }
  #   - What it is: The GitHub account or organization name that owns this repository (e.g., 'michael-coding06').
  #   - Purpose: Forms the root namespace for the hosted package image URL (ghcr.io/<owner>/<image_name>).
  #
  # ${ { secrets.GITHUB_TOKEN } }
  #   - What it is: An automatic, short-lived secret token generated by GitHub for every workflow run.
  #   - Purpose: Authenticates Docker login to GHCR for pushing/pulling images without hardcoding personal credentials.
  #
  # Docker Tag (:tag / ${TAG})
  #   - What it is: The version label attached after the colon in a Docker image name (e.g., :staging, :main).
  #   - Purpose: Identifies the exact build/version of an image so Docker on EC2 pulls the specific branch release instead of an outdated cached image.
  # ==============================================================================
  build-and-push:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Grants GitHub Actions permission to push images to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Downcase Repository Owner
        run: |
          echo "OWNER_LC=${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Built-in GitHub token

      - name: Build and Push API Image to GitHub
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          target: prod
          tags: ghcr.io/${{ env.OWNER_LC }}/livestream-backend:staging
  
  # Job 4: Deploy to EC2
  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.LIVESTREAM_KEY }}
          script_stop: true # Ensures workflow fails immediately if a command returns an error
          script: |
            echo "Deploying to EC2..."
            cd /home/ubuntu/livestream/backend

            # 1. Pull the latest code from GitHub
            git pull origin ${{ github.ref_name }}
            echo "pull origin ${{ github.ref_name }} done"

            # 2. Log into GHCR on EC2 & pull pre-built images from GitHub
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 api consumer
            echo "docker compose up done"

            # 3. Clean up unused old Docker images to save EC2 disk space
            docker image prune -f
            echo "clean up done"


            