name: stream
services:
  kafka1:
    restart: always
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9090,2@kafka2:9090'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9090'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka1:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}

  kafka2:
    restart: always
    image: apache/kafka:3.7.0
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9090,2@kafka2:9090'
      KAFKA_LISTENERS: 'PLAINTEXT://:9093,CONTROLLER://:9090'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka2:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}


  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    command: ["bash", "/kafka-init.sh"]
    volumes:
      - ./kafka-init.sh:/kafka-init.sh:ro
  mysql:
    image: mysql:8
    ports:
      - "3401:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    restart: always
    volumes:             
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    restart: always
    image: redis:7
    ports:
      - "6376:6379"

  api:
    build: .
    command: go run ./cmd/producer
    ports:
      - "8087:8087"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mysql:
        condition: service_started
      redis:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka1:9092,kafka2:9093
      MYSQL_DSN: root:root@tcp(mysql:3306)/streampulse
      REDIS_ADDR: redis:6379
    volumes:
      - .:/app
    working_dir: /app

  consumer:
    build: .
    command: go run ./cmd/consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mysql:
        condition: service_started
      redis:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka1:9092,kafka2:9093
      MYSQL_DSN: root:root@tcp(mysql:3306)/streampulse
      REDIS_ADDR: redis:6379
    volumes:
      - .:/app
    working_dir: /app
